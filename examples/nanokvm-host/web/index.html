<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonlink KVM</title><link rel="stylesheet" href="/style.css"></head>
<body><header><h1>Moonlink KVM</h1><div id="headerStatus" class="status"></div></header><main>
<section id="auth" class="auth hidden"><div class="tabs"><button id="loginTab" class="active">Password</button><button id="recoverTab">Recovery code</button></div>
<form id="loginForm"><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div class="actions"><button>Sign in</button></div></form>
<form id="recoverForm" class="hidden"><div class="grid"><div class="field wide"><label for="otp">Recovery code</label><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="field wide"><label for="recoverPassword">New root password</label><input id="recoverPassword" type="password" minlength="8" autocomplete="new-password" required></div></div><div class="actions"><button>Set root password</button></div></form><div id="authError" class="error"></div></section>
<section id="dashboard" class="hidden"><form id="settingsForm">
<div class="panel"><h2>Identity and stream</h2><div class="grid"><div class="field wide"><label for="name">Host name</label><input id="name" maxlength="64" required></div><div class="field"><label for="codec">Video codec</label><select id="codec"><option value="hevc">HEVC</option><option value="h264">H.264</option></select></div><div class="field"><label for="audio">Audio source</label><select id="audio"><option value="uac2">USB audio</option><option value="none">Disabled</option><option value="silence">Silence</option><option value="tone">Test tone</option></select></div><div class="field"><label for="width">Width</label><input id="width" type="number" min="1" required></div><div class="field"><label for="height">Height</label><input id="height" type="number" min="1" required></div><div class="field"><label for="fps">Capture FPS</label><input id="fps" type="number" min="1" max="240" required></div><div class="field"><label for="divider">Frame divider</label><input id="divider" type="number" min="1" required></div></div></div>
<div class="panel"><h2>Video encoder</h2><div class="grid"><div class="field"><label for="bitrate">Bitrate limit (kbps)</label><input id="bitrate" type="number" min="1" placeholder="Automatic"></div><div class="field"><label for="gop">GOP frames</label><input id="gop" type="number" min="1" required></div><div class="field"><label for="fec">Video FEC (%)</label><input id="fec" type="number" min="0" max="100" required></div><div class="field"><label for="parity">Minimum parity shards</label><input id="parity" type="number" min="0" required></div><div class="field"><label for="loopFilter">HEVC loop filter</label><input id="loopFilter" type="number" placeholder="Driver default"></div><div class="field"><label>Bitstream</label><div class="check"><input id="headers" type="checkbox"><span>Repeat headers</span></div></div><div class="field"><label>Access units</label><div class="check"><input id="aud" type="checkbox"><span>Insert AUD</span></div></div></div></div>
<div class="panel"><h2>Audio encoder</h2><div class="grid"><div class="field"><label for="opusRate">Opus bitrate (kbps)</label><input id="opusRate" type="number" min="16" max="512" required></div><div class="field"><label for="opusComplexity">Opus complexity</label><input id="opusComplexity" type="number" min="0" max="10" required></div></div><div class="actions"><button>Save settings</button><span id="saveStatus" class="status"></span></div></div></form>
<div class="panel"><h2>Moonlight devices</h2><h3>Pending</h3><div id="pendingDevices"></div><h3>Paired</h3><div id="pairedDevices"></div></div>
<div class="panel"><h2>Access</h2><form id="passwordForm"><div class="grid"><div class="field"><label for="currentPassword">Current root password</label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">New root password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div></div><div class="actions"><button class="secondary">Change root password</button><button id="logout" type="button" class="secondary">Sign out</button></div></form></div>
<div class="panel"><h2>System</h2><div class="actions"><button id="reboot" type="button" class="danger">Reboot KVM</button></div></div></section></main><script src="/app.js"></script></body></html>
