name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --workspace
      - name: Run browser transport tests
        run: node --test crates/nanokvm-host/web/tests/*.test.mjs
      - name: Check shell scripts
        run: |
          bash -n scripts/build-nanokvm-riscv64.sh images/nanokvm/build-image.sh
          sh -n crates/nanokvm-host/setup-v4l2-test-devices.sh
